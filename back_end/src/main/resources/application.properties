# Local values can be supplied through .env or process environment variables.
spring.config.import=optional:file:.env[.properties],optional:file:back_end/.env[.properties],optional:file:../.env[.properties]

server.port=${PORT:${SERVER_PORT:10000}}

spring.datasource.url=jdbc:sqlserver://${MSSQL_HOST:localhost}:${MSSQL_PORT:1433};databaseName=${MSSQL_DATABASE:hometutor_database};encrypt=${MSSQL_ENCRYPT:false};trustServerCertificate=${MSSQL_TRUST_SERVER_CERTIFICATE:true}
spring.datasource.username=${MSSQL_USERNAME:sa}
spring.datasource.password=${MSSQL_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

jwt.secret=${JWT_SECRET}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.test-connection=false

app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME}}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never




